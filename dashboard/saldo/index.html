<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/images/logo.jpg" type="image/jpeg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saldo &amp; Topup &mdash; Primexa</title>
  <meta name="description" content="Kelola saldo dan top up akun Primexa kamu.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="/config.js"></script>
  <style>
    :root {
      --bg:        #0a0f1e;
      --bg2:       #0d1424;
      --surface:   #111827;
      --surface2:  #1a2235;
      --border:    rgba(255,255,255,0.08);
      --accent:    #3b82f6;
      --accent2:   #6366f1;
      --text:      #f1f5f9;
      --muted:     #64748b;
      --muted2:    #94a3b8;
      --green:     #22c55e;
      --yellow:    #eab308;
      --red:       #ef4444;
      --success:   #10b981;
      --sidebar-w: 240px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 200;
      transition: transform 0.3s;
    }
    .sidebar-logo {
      display: flex; align-items: center; gap: 10px;
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
    }
    .logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px; color: #fff; flex-shrink: 0;
    }
    .logo-text { font-size: 15px; font-weight: 700; color: var(--text); }
    .logo-text span { color: var(--accent); }

    .sidebar-user { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .sidebar-avatar {
      width: 46px; height: 46px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .sidebar-user-top { display: flex; align-items: center; gap: 12px; }
    .sidebar-user-info { min-width: 0; flex: 1; }
    .sidebar-user-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-user-email { font-size: 11px; color: var(--muted2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-saldo-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px;
    }
    .sidebar-saldo-label { font-size: 12px; color: var(--muted); }
    .sidebar-saldo-value { font-size: 13px; font-weight: 700; color: var(--green); }


    .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px;
      color: var(--muted2); font-size: 13px; font-weight: 500;
      text-decoration: none; border: none; background: none; width: 100%;
      font-family: inherit; cursor: pointer; transition: all 0.2s;
    }
    .nav-item i { width: 16px; font-size: 14px; flex-shrink: 0; }
    .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .nav-item.active {
      color: var(--accent); background: rgba(59,130,246,0.12);
      border-left: 3px solid var(--accent); padding-left: 17px;
    }
    .nav-item.active i { color: var(--accent); }
    .nav-item.danger { color: var(--red); }
    .nav-item.danger:hover { background: rgba(239,68,68,0.1); }
    .sidebar-bottom { padding: 12px 0; border-top: 1px solid var(--border); }

    /* ── MAIN ── */
    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px; border-bottom: 1px solid var(--border);
      background: var(--surface); position: sticky; top: 0; z-index: 100;
    }
    .topbar-title { font-size: 22px; font-weight: 800; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .topbar-user-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 10px;
      cursor: pointer; color: var(--text); font-size: 13px; font-weight: 600;
      text-decoration: none; transition: all 0.2s;
    }
    .topbar-user-btn:hover { border-color: var(--accent); }
    .user-dropdown-wrap { position: relative; }
    .user-dropdown {
      position: absolute; top: calc(100% + 8px); right: 0;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; min-width: 210px; z-index: 500;
      overflow: hidden; display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .user-dropdown.open { display: block; animation: dropFade 0.15s ease; }
    @keyframes dropFade { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
    .dropdown-info { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .dropdown-dname { font-size: 14px; font-weight: 600; }
    .dropdown-demail { font-size: 12px; color: var(--muted2); margin-top: 2px; }
    .dropdown-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; font-size: 13px; font-weight: 500;
      color: var(--text); text-decoration: none; cursor: pointer;
      background: none; border: none; width: 100%; font-family: inherit; transition: background 0.15s;
    }
    .dropdown-item:hover { background: rgba(255,255,255,0.06); }
    .dropdown-item.danger { color: var(--red); }
    .dropdown-item i { font-size: 13px; width: 16px; }
    .btn-visit-store {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 12px; padding: 8px 12px; border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); text-decoration: none;
      font-size: 12px; font-weight: 500; transition: all 0.2s;
    }
    .btn-visit-store:hover { border-color: var(--accent); color: var(--accent); }
    .btn-visit-store i { font-size: 11px; }
    .topbar-avatar {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
    }
    .content { padding: 28px; flex: 1; }
    .hamburger-btn { display: none; background: none; border: none; color: var(--text); font-size: 18px; cursor: pointer; padding: 4px; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }

    /* ── SALDO PAGE STYLES ── */
    .balance-banner {
      background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 50%, #6366f1 100%);
      border-radius: 16px; padding: 24px 28px; margin-bottom: 24px;
      position: relative; overflow: hidden;
    }
    .balance-banner::after {
      content: ''; position: absolute; right: -30px; top: -30px;
      width: 200px; height: 200px; background: rgba(255,255,255,0.06); border-radius: 50%;
    }
    .balance-banner::before {
      content: ''; position: absolute; right: 60px; bottom: -50px;
      width: 150px; height: 150px; background: rgba(255,255,255,0.04); border-radius: 50%;
    }
    .balance-label { font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 6px; display: block; position: relative; z-index: 1; }
    .balance-value { font-size: 32px; font-weight: 800; color: #fff; position: relative; z-index: 1; }

    .panels-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }
    .panel-body { padding: 24px; }
    .panel-title { font-size: 17px; font-weight: 700; margin-bottom: 20px; }

    .form-label { font-size: 13px; font-weight: 600; color: var(--muted2); margin-bottom: 10px; display: block; }
    .form-group { margin-bottom: 18px; }

    .nominal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .nominal-btn {
      padding: 10px 6px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center;
    }
    .nominal-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nominal-btn.active { background: rgba(59,130,246,0.15); border-color: var(--accent); color: var(--accent); }

    .input-wrap { display: flex; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .input-prefix { padding: 0 12px; color: var(--muted); font-size: 14px; font-weight: 600; border-right: 1px solid var(--border); height: 42px; display: flex; align-items: center; }
    .input-suffix { padding: 0 12px; color: var(--muted); border-left: 1px solid var(--border); height: 42px; display: flex; align-items: center; }
    .input-inner { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 14px; padding: 0 12px; height: 42px; }
    .input-inner::placeholder { color: var(--muted); }
    .form-select {
      width: 100%; padding: 10px 14px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: inherit; font-size: 14px; cursor: pointer; outline: none;
    }
    .btn-topup {
      width: 100%; padding: 12px; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; font-family: inherit; font-size: 15px;
      font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 8px; transition: all 0.2s; margin-top: 4px;
    }
    .btn-topup:hover { background: #2563eb; }
    .btn-topup:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 24px; }
    .tab-btn {
      padding: 14px 16px; font-family: inherit; font-size: 13px; font-weight: 600;
      background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--muted2); cursor: pointer; transition: all 0.2s; margin-bottom: -1px;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: none; padding: 24px; }
    .tab-content.active { display: block; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; color: var(--muted); text-align: center; }
    .empty-state i { font-size: 32px; margin-bottom: 10px; opacity: 0.4; }
    .empty-state p { font-size: 13px; }

    .history-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border); gap: 12px; }
    .history-item:last-child { border-bottom: none; }
    .history-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .history-icon.in  { background: rgba(34,197,94,0.12); color: var(--green); }
    .history-icon.out { background: rgba(239,68,68,0.12); color: var(--red); }
    .history-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .history-label { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-date  { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .history-amount { font-size: 13px; font-weight: 700; white-space: nowrap; }
    .amount-in  { color: var(--green); }
    .amount-out { color: var(--red); }

    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .badge-success { background: rgba(34,197,94,0.15); color: var(--green); }
    .badge-pending { background: rgba(234,179,8,0.15); color: var(--yellow); }
    .badge-danger  { background: rgba(239,68,68,0.15); color: var(--red); }

    /* Toast */
    #toastWrap { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 18px; display: flex; align-items: center; gap: 12px;
      font-size: 13px; font-weight: 600; min-width: 260px;
      animation: slideIn 0.3s ease;
    }
    .toast.success { border-color: rgba(34,197,94,0.4); }
    .toast.error   { border-color: rgba(239,68,68,0.4); }
    .toast i { font-size: 16px; }
    .toast.success i { color: var(--green); }
    .toast.error i   { color: var(--red); }
    @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

    /* Skeleton */
    .skeleton { background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* Responsive */
    @media (max-width: 1024px) { .panels-row { grid-template-columns: 1fr; } }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .main { margin-left: 0; }
      .topbar { padding: 12px 16px; }
      .topbar-title { font-size: 18px; }
      .content { padding: 16px; }
      .hamburger-btn { display: block; }
      .nominal-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <a href="/" class="sidebar-logo">
    <img src="/images/logo.jpg" alt="Primexa" style="height:36px;width:auto;object-fit:contain;border-radius:8px;">
  </a>
  <div class="sidebar-user">
    <div class="sidebar-user-top">
      <div class="sidebar-avatar" id="sidebarAvatar">?</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebarName">Loading...</div>
        <div class="sidebar-user-email" id="sidebarEmail">-</div>
      </div>
    </div>
    <div class="sidebar-saldo-row">
      <span class="sidebar-saldo-label">Saldo</span>
      <span class="sidebar-saldo-value" id="sidebarSaldo">Rp 0</span>
    </div>
    <a href="/" target="_blank" class="btn-visit-store">
      <i class="fa-solid fa-arrow-up-right-from-square"></i> Kunjungi Website Toko
    </a>

  </div>
  <nav class="sidebar-nav">
    <a href="/dashboard" class="nav-item" id="navDashboard">
      <i class="fa-solid fa-gauge-high"></i> Dashboard
    </a>
    <a href="/dashboard/pesanan" class="nav-item" id="navPesanan">
      <i class="fa-solid fa-bag-shopping"></i> Pesanan Saya
    </a>
    <a href="/dashboard/saldo" class="nav-item active" id="navSaldo">
      <i class="fa-solid fa-wallet"></i> Saldo &amp; Topup
    </a>
    <a href="/dashboard/wishlist" class="nav-item" id="navWishlist">
      <i class="fa-solid fa-heart"></i> Wishlist
    </a>
    <a href="/profile" class="nav-item" id="navProfil">
      <i class="fa-solid fa-user"></i> Profil
    </a>
  </nav>
  <div class="sidebar-bottom">
    <a href="/" class="nav-item"><i class="fa-solid fa-arrow-left"></i> Kembali ke Toko</a>
    <button class="nav-item danger" onclick="handleLogout()">
      <i class="fa-solid fa-right-from-bracket"></i> Keluar
    </button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      <h1 class="topbar-title">Saldo &amp; Topup</h1>
    </div>
    <div class="topbar-right">
      <div class="user-dropdown-wrap" id="userDropdownWrap">
        <div class="topbar-user-btn" id="topbarUser" onclick="toggleUserDropdown()">
          <div class="topbar-avatar" id="topbarAvatar">?</div>
          <span id="topbarName">Akun</span>
          <i class="fa-solid fa-chevron-down" id="dropdownChevron" style="font-size:10px;opacity:.5;transition:transform 0.2s;"></i>
        </div>
        <div class="user-dropdown" id="userDropdown">
          <div class="dropdown-info">
            <div class="dropdown-dname" id="dropdownName">-</div>
            <div class="dropdown-demail" id="dropdownEmail">-</div>
          </div>
          <a href="/profile" class="dropdown-item"><i class="fa-solid fa-user"></i> Profil Saya</a>
          <a href="/" target="_blank" class="dropdown-item"><i class="fa-solid fa-store"></i> Kunjungi Toko</a>
          <button class="dropdown-item danger" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <!-- Balance Banner -->
    <div class="balance-banner">
      <span class="balance-label">Saldo Anda</span>
      <div class="balance-value" id="balanceValue">Rp 0</div>
    </div>

    <!-- Panels Row -->
    <div class="panels-row">
      <!-- TopUp Form -->
      <div class="panel">
        <div class="panel-body">
          <div class="panel-title">Top Up Saldo</div>

          <div class="form-group">
            <label class="form-label">Pilih Nominal</label>
            <div class="nominal-grid">
              <button class="nominal-btn" onclick="selectNominal(10000)">10.000</button>
              <button class="nominal-btn" onclick="selectNominal(25000)">25.000</button>
              <button class="nominal-btn" onclick="selectNominal(50000)">50.000</button>
              <button class="nominal-btn" onclick="selectNominal(100000)">100.000</button>
              <button class="nominal-btn" onclick="selectNominal(250000)">250.000</button>
              <button class="nominal-btn" onclick="selectNominal(500000)">500.000</button>
              <button class="nominal-btn" onclick="selectNominal(1000000)">1.000.000</button>
              <button class="nominal-btn" onclick="selectNominal(5000000)">5.000.000</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Atau Masukkan Nominal</label>
            <div class="input-wrap">
              <span class="input-prefix">Rp</span>
              <input type="number" id="customAmount" class="input-inner" placeholder="Min 100, Maks 10.000.000" oninput="handleCustomInput()">
              <span class="input-suffix"><i class="fa-solid fa-lock" style="font-size:12px;"></i></span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Metode Pembayaran</label>
            <select id="paymentMethod" class="form-select">
              <option value="qris">QRIS GatePay (Gratis ≤ Rp 500.000, 0,7% di atasnya)</option>
              <option value="saldo">Saldo Akun</option>
            </select>
          </div>

          <button class="btn-topup" id="topupBtn" onclick="handleTopUp()">
            <i class="fa-solid fa-bolt"></i> Top Up Sekarang
          </button>
        </div>
      </div>

      <!-- History -->
      <div class="panel">
        <div class="tabs">
          <button class="tab-btn active" id="tabBtnSaldo" onclick="switchTab('saldo')">Riwayat Saldo</button>
          <button class="tab-btn" id="tabBtnTopup" onclick="switchTab('topup')">Riwayat Top Up</button>
        </div>
        <div class="tab-content active" id="tabSaldo">
          <div id="saldoHistoryContent">
            <div class="empty-state"><i class="fa-solid fa-receipt"></i><p>Belum ada riwayat saldo</p></div>
          </div>
        </div>
        <div class="tab-content" id="tabTopup">
          <div id="topupHistoryContent">
            <div class="empty-state"><i class="fa-solid fa-wallet"></i><p>Belum ada riwayat top up</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toastWrap"></div>

<script>
/* ── CONFIG ── */
var API = (typeof window.APP_CONFIG !== 'undefined' && window.APP_CONFIG.API_URL)
  ? window.APP_CONFIG.API_URL
  : (window.location.origin + '/api');

/* ── AUTH GUARD ── */
var user = null, token = null;
try {
  user  = JSON.parse(localStorage.getItem('ramx_auth_user') || 'null');
  token = localStorage.getItem('ramx_token');
} catch(e) {}
if (!user || !token) {
  window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
}

/* ── HELPERS ── */
function fmtRp(n) { return 'Rp ' + (Number(n) || 0).toLocaleString('id-ID'); }
function initials(name) {
  var n = (name || 'A').trim().split(' ');
  return (n[0][0] + (n[1] ? n[1][0] : '')).toUpperCase();
}
function fmtDateShort(d) {
  return new Date(d).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function showToast(msg, type) {
  var icon = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';
  var t = document.createElement('div');
  t.className = 'toast ' + (type || 'success');
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i><span>' + msg + '</span>';
  document.getElementById('toastWrap').appendChild(t);
  setTimeout(function() { t.remove(); }, 3500);
}

/* ── LOGOUT + SIDEBAR ── */
function handleLogout() {
  localStorage.removeItem('ramx_auth_user');
  localStorage.removeItem('ramx_token');
  localStorage.removeItem('ramx_remember');
  window.location.href = '/';
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

/* ── FILL USER ── */
function fillUser(u) {
  var name  = u.name || u.telegram || 'Pengguna';
  var email = u.email || ('@' + u.telegram) || '-';
  var saldo = u.balance || 0;
  var init  = initials(name);
  document.getElementById('sidebarAvatar').textContent = init;
  document.getElementById('sidebarName').textContent   = name;
  document.getElementById('sidebarEmail').textContent  = email;
  document.getElementById('sidebarSaldo').textContent  = fmtRp(saldo);
  document.getElementById('topbarAvatar').textContent  = init;
  document.getElementById('topbarName').textContent    = name;
  var dname  = document.getElementById('dropdownName');
  var demail = document.getElementById('dropdownEmail');
  if (dname)  dname.textContent  = name;
  if (demail) demail.textContent = email;
  var bv = document.getElementById('balanceValue');
  if (bv) bv.textContent = fmtRp(saldo);
}

function toggleUserDropdown() {
  var dd = document.getElementById('userDropdown');
  var ch = document.getElementById('dropdownChevron');
  dd.classList.toggle('open');
  ch.style.transform = dd.classList.contains('open') ? 'rotate(180deg)' : '';
}
document.addEventListener('click', function(e) {
  var wrap = document.getElementById('userDropdownWrap');
  var dd   = document.getElementById('userDropdown');
  var ch   = document.getElementById('dropdownChevron');
  if (wrap && !wrap.contains(e.target)) {
    dd.classList.remove('open');
    if (ch) ch.style.transform = '';
  }
});


/* ── LOAD FRESH USER ── */
async function loadFreshUser() {
  try {
    var res = await fetch(API + '/auth/me', { headers: { 'Authorization': 'Bearer ' + token } , credentials: 'include' });
    if (!res.ok) throw new Error('unauthorized');
    var data = await res.json();
    var freshUser = data.user || data;
    localStorage.setItem('ramx_auth_user', JSON.stringify(freshUser));
    fillUser(freshUser);
  } catch(e) {
    if (user) fillUser(user);
    if (e.message === 'unauthorized') handleLogout();
  }
}

/* ── LOAD PAYMENT METHODS ── */
async function loadPaymentMethods() {
  try {
    var res  = await fetch(API + '/payment-methods', { headers: { 'Authorization': 'Bearer ' + token } , credentials: 'include' });
    var data = await res.json();
    var methods = data.methods || data || [];
    if (!methods.length) return;
    var sel = document.getElementById('paymentMethod');
    sel.innerHTML = methods.filter(function(m) { return m.active; }).map(function(m) {
      var fee = m.fee ? ' (' + m.fee + ')' : '';
      return '<option value="' + (m._id || m.id) + '">' + m.name + fee + '</option>';
    }).join('');
  } catch(e) { /* Fallback ke option default di HTML */ }
}

/* ── NOMINAL SELECT ── */
var currentAmount = 0;
function selectNominal(n) {
  currentAmount = n;
  document.getElementById('customAmount').value = n;
  document.querySelectorAll('.nominal-btn').forEach(function(b) {
    var v = parseInt(b.textContent.replace(/\./g, ''));
    b.classList.toggle('active', v === n);
  });
}
function handleCustomInput() {
  var v = parseInt(document.getElementById('customAmount').value) || 0;
  currentAmount = v;
  document.querySelectorAll('.nominal-btn').forEach(function(b) {
    var bv = parseInt(b.textContent.replace(/\./g, ''));
    b.classList.toggle('active', bv === v);
  });
}

/* ── TOP UP ── */
async function handleTopUp() {
  var amount = parseInt(document.getElementById('customAmount').value) || 0;
  var method = document.getElementById('paymentMethod').value;
  if (!amount || amount < 100) { showToast('Minimal top up adalah Rp 100', 'error'); return; }
  if (amount > 10000000)       { showToast('Maksimal top up adalah Rp 10.000.000', 'error'); return; }
  var btn = document.getElementById('topupBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
  try {
    var res  = await fetch(API + '/topup', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ amount: amount, method: method })
    });

    var data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Gagal');
    showToast('Berhasil membuat instruksi top up ' + fmtRp(amount), 'success');
    document.getElementById('customAmount').value = '';
    currentAmount = 0;
    document.querySelectorAll('.nominal-btn').forEach(function(b) { b.classList.remove('active'); });
    loadFreshUser();
    switchTab('topup');
    loadHistory('topup');
  } catch(e) {
    showToast(e.message || 'Terjadi kesalahan', 'error');
  }
  btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Top Up Sekarang';
}

/* ── TABS ── */
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
  document.getElementById('tabBtn' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
}

/* ── LOAD HISTORY ── */
async function loadHistory(type) {
  var containerId = type === 'saldo' ? 'saldoHistoryContent' : 'topupHistoryContent';
  var container   = document.getElementById(containerId);
  container.innerHTML = '<div class="skeleton" style="height:60px;margin-bottom:8px;"></div><div class="skeleton" style="height:60px;margin-bottom:8px;"></div><div class="skeleton" style="height:60px;"></div>';
  try {
    var endpoint = type === 'saldo' ? '/balance/history' : '/topup/history';
    var res  = await fetch(API + endpoint, { headers: { 'Authorization': 'Bearer ' + token } , credentials: 'include' });
    var data = await res.json();
    var items = data.transactions || data.history || data || [];
    if (!items.length) {
      var emptyIcon = type === 'saldo' ? 'fa-receipt' : 'fa-wallet';
      var emptyText = type === 'saldo' ? 'Belum ada riwayat saldo' : 'Belum ada riwayat top up';
      container.innerHTML = '<div class="empty-state"><i class="fa-solid ' + emptyIcon + '"></i><p>' + emptyText + '</p></div>';
      return;
    }
    container.innerHTML = items.map(function(item) {
      var isIn  = (item.type === 'in' || item.type === 'topup' || item.amount > 0);
      var cls   = isIn ? 'in' : 'out';
      var sign  = isIn ? '+' : '-';
      var amt   = Math.abs(item.amount || item.total || 0);
      var lbl   = item.description || item.desc || (isIn ? 'Top Up' : 'Pembayaran');
      var dt    = item.createdAt || item.date || '';
      return '<div class="history-item">' +
        '<div class="history-info">' +
          '<div class="history-icon ' + cls + '"><i class="fa-solid ' + (isIn ? 'fa-arrow-down' : 'fa-arrow-up') + '"></i></div>' +
          '<div><div class="history-label">' + lbl + '</div><div class="history-date">' + (dt ? fmtDateShort(dt) : '') + '</div></div>' +
        '</div>' +
        '<div class="history-amount amount-' + cls + '">' + sign + fmtRp(amt) + '</div>' +
      '</div>';
    }).join('');
  } catch(e) {
    var emptyIcon2 = type === 'saldo' ? 'fa-receipt' : 'fa-wallet';
    var emptyText2 = type === 'saldo' ? 'Belum ada riwayat saldo' : 'Belum ada riwayat top up';
    container.innerHTML = '<div class="empty-state"><i class="fa-solid ' + emptyIcon2 + '"></i><p>' + emptyText2 + '</p></div>';
  }
}

/* ── INIT ── */
(async function() {
  if (user) fillUser(user);
  await loadFreshUser();
  await loadPaymentMethods();
  loadHistory('saldo');
})();
</script>
