  <style>
    .legal-hero {
      padding: 90px 24px 40px;
      text-align: center;
      background: linear-gradient(180deg, #0b1120 0%, var(--bg-primary) 100%);
    }
    .legal-hero-icon {
      width: 72px; height: 72px;
      background: rgba(59,130,246,0.12);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; color: var(--accent);
      margin: 0 auto 18px;
    }
    .legal-hero h1 { font-size: clamp(24px,5vw,38px); font-weight: 800; margin-bottom: 8px; }
    .legal-hero .updated { font-size: 13px; color: var(--text-muted); }

    .legal-body {
      max-width: 820px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }

    /* TOC */
    .legal-toc {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 32px;
    }
    .legal-toc h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .legal-toc ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    @media(max-width:500px){ .legal-toc ul { grid-template-columns: 1fr; } }
    .legal-toc a { font-size: 13px; color: var(--accent); text-decoration: none; }
    .legal-toc a:hover { text-decoration: underline; }

    /* Content */
    .legal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 36px;
      line-height: 1.8;
      font-size: 15px;
      color: var(--text-secondary);
    }
    @media(max-width:600px){ .legal-content { padding: 20px 18px; } }
    .legal-content h2 { font-size: 22px; font-weight: 800; color: var(--text-primary); margin: 0 0 16px; }
    .legal-content h3 { font-size: 16px; font-weight: 700; color: var(--text-primary); margin: 28px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .legal-content p  { margin: 0 0 14px; }
    .legal-content ul, .legal-content ol { padding-left: 20px; margin: 0 0 14px; }
    .legal-content li { margin-bottom: 6px; }
    .legal-content strong { color: var(--text-primary); }
    .legal-content a { color: var(--accent); }

    /* CTA bar */
    .legal-cta {
      margin-top: 28px;
      padding: 18px 24px;
      background: rgba(59,130,246,0.07);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .legal-cta p { font-size: 14px; color: var(--text-muted); margin: 0; }
    .legal-cta a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      background: #25D366; color: #fff;
      border-radius: 50px; font-weight: 700; font-size: 14px;
      text-decoration: none; white-space: nowrap;
      transition: transform 0.2s;
    }
    .legal-cta a:hover { transform: translateY(-1px); }

    /* WA Float */
    .wa-float { position: fixed; bottom: 24px; right: 24px; z-index: 9000; }
    .wa-btn   { width: 56px; height: 56px; border-radius: 50%; background: #25D366; border: none; cursor: pointer; font-size: 28px; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(37,211,102,0.4); transition: transform 0.2s; }
    .wa-btn:hover { transform: scale(1.1); }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-logo">

  </a>
  <div style="flex:1"></div>
  <div class="nav-actions">
    <a href="/" class="nav-btn"><i class="fa-solid fa-house"></i> Beranda</a>
    <a href="/produk" class="nav-btn"><i class="fa-solid fa-box"></i> Produk</a>
    <button class="nav-btn nav-btn-icon desktop-theme-btn" onclick="toggleTheme()" id="themeBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <button class="nav-btn btn-login"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
  </div>
</nav>

<section class="legal-hero">
  <div class="legal-hero-icon"><i class="fa-solid fa-file-contract"></i></div>
  <h1>Syarat &amp; Ketentuan</h1>

</section>

<div class="legal-body">
  <div class="legal-toc" id="tocBox" style="display:none;">
    <h3><i class="fa-solid fa-list"></i> Daftar Isi</h3>

  <div class="legal-content" id="legalContent">
    <div style="text-align:center;padding:40px;color:var(--text-muted);">

      <p style="margin-top:12px;">Memuat konten...</p>

  <div class="legal-cta">
    <p><i class="fa-solid fa-circle-question"></i> Ada pertanyaan tentang ketentuan ini?</p>
    <a href="https://wa.me/6287818959393" target="_blank"><i class="fa-brands fa-whatsapp"></i> Hubungi Kami</a>

</div>

  <button class="wa-btn" onclick="window.open('https://wa.me/6287818959393','_blank')">
    <i class="fa-brands fa-whatsapp"></i>
  </button>
</div>

<script>
  /* â”€â”€ Theme â”€â”€ */
  (function(){
    var t=localStorage.getItem('ramx-theme')||'dark';
    document.documentElement.setAttribute('data-theme',t);
    var icon=document.getElementById('themeIcon');
    if(icon&&t==='light') icon.innerHTML='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  })();
  function toggleTheme(){
    var cur=document.documentElement.getAttribute('data-theme');
    var next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    localStorage.setItem('ramx-theme',next);
    var icon=document.getElementById('themeIcon');
    if(icon) icon.innerHTML=next==='light'?'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>':'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }

  /* â”€â”€ Default Content â”€â”€ */
  var DEFAULT_TERMS = `<h2>Syarat &amp; Ketentuan</h2>
<p>Dengan menggunakan layanan Primexa, Anda menyetujui syarat dan ketentuan berikut ini secara keseluruhan.</p>

<h3>1. Ketentuan Umum</h3>
<p>Primexa adalah toko produk digital yang menyediakan berbagai kebutuhan aplikasi premium, streaming, editing, desain, dan voucher game. Dengan mengakses atau menggunakan layanan kami, Anda menyetujui untuk terikat oleh ketentuan-ketentuan ini.</p>

<h3>2. Pembelian &amp; Pembayaran</h3>
<p>Setiap pembelian bersifat final setelah pembayaran dikonfirmasi. Kami mendukung berbagai metode pembayaran termasuk transfer bank, QRIS, dan dompet digital. Pastikan data yang Anda masukkan sudah benar sebelum melakukan checkout.</p>

<h3>3. Pengiriman Produk</h3>
<p>Produk digital dikirimkan secara <strong>otomatis dan instan</strong> setelah pembayaran terverifikasi \u2014 biasanya kurang dari 5 menit. Jika belum diterima dalam 15 menit, silakan hubungi tim CS kami.</p>

<h3>4. Garansi</h3>
<p>Setiap produk dilengkapi garansi sesuai ketentuan masing-masing produk. Detail garansi tercantum di halaman setiap produk. Garansi hanya berlaku jika produk tidak berfungsi sesuai deskripsi.</p>

<h3>5. Larangan Penggunaan</h3>
<ul>
  <li>Menggunakan produk untuk tujuan ilegal</li>
  <li>Menjual kembali produk tanpa izin tertulis dari kami</li>
  <li>Melakukan kecurangan dalam proses pembayaran</li>
  <li>Menyalahgunakan sistem garansi</li>
</ul>

<h3>6. Pembatasan Tanggung Jawab</h3>
<p>Primexa tidak bertanggung jawab atas kerugian tidak langsung yang timbul dari penggunaan produk kami. Tanggung jawab kami terbatas pada nilai transaksi yang dilakukan.</p>

<h3>7. Perubahan Ketentuan</h3>
<p>Primexa berhak mengubah syarat dan ketentuan ini sewaktu-waktu tanpa pemberitahuan sebelumnya. Perubahan berlaku efektif setelah dipublikasikan di website ini.</p>

<h3>8. Hubungi Kami</h3>
<p>Jika Anda memiliki pertanyaan mengenai syarat dan ketentuan ini, silakan hubungi kami melalui email di <a href="mailto:support@Primexa.id">support@Primexa.id</a> atau melalui WhatsApp.</p>`;

  /* â”€â”€ Load & Render â”€â”€ */
  function loadContent() {
    var saved = localStorage.getItem('ramx_page_terms');
    var html  = (saved !== null && saved.trim() !== '') ? saved : DEFAULT_TERMS;
    document.getElementById('legalContent').innerHTML = html;

    // Build TOC from h3 headings
    var headings = document.getElementById('legalContent').querySelectorAll('h3');
    if (headings.length > 2) {
      var tocList = document.getElementById('tocList');
      headings.forEach(function(h, i) {
        h.id = 'section-' + i;
        var li = document.createElement('li');
        li.innerHTML = '<a href="#section-'+i+'">'+h.textContent+'</a>';
        tocList.appendChild(li);
      });
      document.getElementById('tocBox').style.display = 'block';
    }
  }

  loadContent();

  // Listen for storage changes (tab sync)
  window.addEventListener('storage', function(e) {
    if (e.key === 'ramx_page_terms') loadContent();
  });
</script>
<script src="/shared-config.js"></script>
</body>
